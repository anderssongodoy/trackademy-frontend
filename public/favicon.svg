<svg width="48" height="48" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
  <rect width="48" height="48" fill="#ffffff"/>

  <!-- Graduation cap board (perspective rhombus) -->
  <polygon points="24,7 43,16 24,21 5,16" fill="#252523"/>

  <!-- Cap body (3D depth below board) -->
  <polygon points="14,19 34,19 28,27 20,27" fill="#1a1a18"/>

  <!-- Tassel rope -->
  <line x1="5" y1="16" x2="3" y2="26" stroke="#252523" stroke-width="1.8" stroke-linecap="round"/>

  <!-- Tassel body -->
  <rect x="1" y="26" width="5" height="5" rx="1.5" fill="#252523"/>

  <!-- Progress bar track -->
  <rect x="13" y="30" width="28" height="9" rx="4.5" fill="none" stroke="#c4572a" stroke-width="1.5"/>

  <!-- Progress bar filled segments (3 of 4) -->
  <rect x="15.5" y="32.5" width="5" height="4" rx="1.5" fill="#c4572a"/>
  <rect x="22"   y="32.5" width="5" height="4" rx="1.5" fill="#c4572a"/>
  <rect x="28.5" y="32.5" width="5" height="4" rx="1.5" fill="#c4572a"/>
</svg>
